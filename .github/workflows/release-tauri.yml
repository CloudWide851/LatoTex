name: Release Tauri App

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build Windows x64 NSIS
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore pinned Windows runtime cache
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/tools
          key: latotex-bundled-tools-win-x64-v1-${{ hashFiles('scripts/prepare-bundled-tools-win-x64.ps1', 'scripts/assets/tectonic-offline-seed-2022.0r0.zip') }}

      - name: Prepare pinned Windows x64 tools
        run: pnpm release:prepare-tools:win-x64

      - name: Windows x64 validation gate
        run: pnpm release:validate:win-x64

      - name: Windows x64 unsigned NSIS package gate
        run: pnpm release:package:win-x64

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: latotex-windows-x64
          if-no-files-found: error
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build-windows-x64

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Download Windows x64 installer
        uses: actions/download-artifact@v4
        with:
          name: latotex-windows-x64
          path: release-artifacts

      - name: Extract release notes from changelog
        run: node scripts/extract-release-notes.mjs --version "${GITHUB_REF_NAME#v}" --output release-notes.md

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          name: LatoTex ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: release-artifacts/*.exe
